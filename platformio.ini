; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = espidf

debug_tool = esp-builtin
upload_protocol = esp-builtin

[env:tests]
platform = native
test_framework = unity
build_src_filter = 
    +<../test>  
    +<model/gisteresys_model.hpp>
	+<model/gisteresys_model.cpp>
	+<model/sliding_model.hpp>
	+<model/sliding_model.cpp>
	+<controller/application.hpp>
	+<input/abstract_light.hpp>
	+<output/abstract_led.hpp>
	+<controller/application.cpp>
	+<input/abstract_light.cpp>
	+<output/abstract_led.cpp>
	+<model/abstract_gisteresys_model.hpp>
	+<model/abstract_gisteresys_model.cpp>
	+<model/abstract_sliding_model.hpp>
	+<model/abstract_sliding_model.cpp>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I.pio/libdeps/tests/FakeIt/single_header/standalone
lib_deps =
    https://github.com/eranpeer/FakeIt.git
